name: casino

services:
  mysql:
    image: mysql:8.4
    container_name: casino-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: casino
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: casino-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

volumes:
  mysql-data:
  redis-data:
