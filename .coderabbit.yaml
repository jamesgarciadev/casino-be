# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews pull requests on GitHub. Reference: https://docs.coderabbit.ai/reference/configuration
language: en-US

reviews:
  profile: chill
  high_level_summary: true
  review_status: true
  collapse_walkthrough: true
  estimate_code_review_effort: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!composer.lock"
    # Generated by `composer schema:print` from graphql/schema.graphql, which is what to review.
    - "!graphql/schema.public.graphql"
  path_instructions:
    - path: "app/Services/**"
      instructions: |
        This is the play-money logic (bets, combos, cash-out, settlement, wallets).
        - Credits are whole integers. Money maths stays in integers (see Bet::payoutFor, totalOdds, cashOutValue), never floats.
        - Placing a bet, cashing out and settling each run in one database transaction and lock rows in the same order:
          fixture, then bet, then wallet. Flag any new path that locks in a different order.
        - Odds always come from the database rows, never from the client.
        - Settlement and cash-out must be idempotent and must never pay twice.
        - Problems a player can fix throw RuleViolation, whose message is safe to show.
    - path: "graphql/schema.graphql"
      instructions: |
        The API contract. Every query and mutation that touches a player's or staff member's data needs @guard and a
        @tokenCan ability (customer, admin or sim). Admin fields also need a policy check. New inputs need @rules.
        Changes should be additive; flag anything that would break casino-web, casino-fe or casino-mobile.
    - path: "app/GraphQL/**"
      instructions: |
        Resolvers stay thin and delegate to app/Services. No business rules or raw queries beyond simple reads.
    - path: "app/Policies/**"
      instructions: |
        Deny by default. The simulator account keeps its role: nobody can reassign it.
    - path: "database/migrations/**"
      instructions: |
        Tests run on SQLite but production is MySQL, so check the migration is valid on MySQL (for example a foreign
        key must be dropped before the index it uses). down() should reverse up(). Existing rows must survive.
    - path: "tests/**"
      instructions: |
        Every new rule or behaviour has a test, and money paths cover the refusals (insufficient balance, closed match,
        wrong owner, double submit), not only the happy path.
  tools:
    gitleaks:
      enabled: true
    # Our docs wrap at 120 columns and use wide tables, which the default markdownlint rules reject.
    markdownlint:
      enabled: false

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "ARCHITECTURE.md"
