# Casino API contract. This file is the single source of truth for fe and web.
# Never remove or rename a field in place: add the new one and mark the old one @deprecated.
#
# Admin-only fields are prefixed with `admin` and always carry
# @guard + @tokenCan(ability: "admin") + a @can* policy check.

"An ISO 8601 datetime string with timezone, e.g. `2026-10-29T13:43:32+00:00`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTimeTz")

type Query {
    "The currently authenticated user (any token scope)."
    me: User @guard @auth

    "Staff: list users. Requires `users.view`."
    adminUsers(
        "Matches name or email."
        search: String @scope(name: "search")
    ): [User!]!
        @guard
        @tokenCan(ability: "admin")
        @canModel(ability: "viewAny", model: "App\\Models\\User")
        @paginate(defaultCount: 20, maxCount: 100)
        @orderBy(column: "id", direction: DESC)

    "Staff: audit log of admin and auth events. Requires `activity.view`."
    adminActivities(
        logName: String @eq(key: "log_name")
    ): [Activity!]!
        @guard
        @tokenCan(ability: "admin")
        @canModel(ability: "viewAny", model: "App\\Models\\Activity")
        @paginate(defaultCount: 20, maxCount: 100)
        @orderBy(column: "id", direction: DESC)

    "Esports titles PandaScore covers. Public."
    videogames: [Videogame!]! @throttle(prefix: "esports", maxAttempts: 60, decayMinutes: 1)

    "Esports matches from PandaScore. Cached for 15s (running), 1 min (upcoming) or 10 min (past). Public."
    esportsMatches(
        window: MatchWindow! = UPCOMING
        "A `Videogame.slug`, e.g. `cs-go`. Unknown slugs return no matches."
        game: String @rules(apply: ["nullable", "regex:/^[a-z0-9-]{1,40}$/"])
        page: Int! = 1 @rules(apply: ["integer", "min:1", "max:1000"])
        perPage: Int! = 20 @rules(apply: ["integer", "min:1", "max:50"])
    ): EsportsMatchPage! @throttle(prefix: "esports", maxAttempts: 60, decayMinutes: 1)

    "A single esports match by PandaScore id. Public."
    esportsMatch(id: ID! @rules(apply: ["regex:/^[1-9][0-9]{0,9}$/"])): EsportsMatch
        @throttle(prefix: "esports", maxAttempts: 60, decayMinutes: 1)

    "Bettable matches, live first, then by start time. Without `state`, finished matches are left out. Public."
    matches(
        state: MatchState
        "A `Videogame.slug`, e.g. `cs-go`."
        game: String @rules(apply: ["nullable", "regex:/^[a-z0-9-]{1,40}$/"])
    ): [Match!]!

    "A bettable match. Public."
    match(id: ID! @eq): Match @find

    "The signed-in customer's play-money wallet (opened with 1,000 CR on first use)."
    wallet: Wallet! @guard @tokenCan(ability: "customer")

    """
    The signed-in customer's bets, newest first. open: true for PENDING bets only, false for settled (WON or LOST) only.
    Page with first (1-100, default 100) and before: the id of the last bet already loaded.
    """
    myBets(
        open: Boolean
        first: Int = 100 @rules(apply: ["integer", "min:1", "max:100"])
        before: ID @rules(apply: ["nullable", "integer"])
    ): [Bet!]! @guard @tokenCan(ability: "customer")
}

type Mutation {
    "Create a customer account and return a customer-scoped token."
    register(input: RegisterInput! @spread): AuthPayload! @throttle(prefix: "register", maxAttempts: 5, decayMinutes: 1)

    "Customer sign-in for the web app. Returns a customer-scoped token."
    login(input: LoginInput! @spread): AuthPayload! @throttle(prefix: "login", maxAttempts: 5, decayMinutes: 1)

    "Staff sign-in for the admin console. Returns an admin-scoped token."
    adminLogin(input: LoginInput! @spread): AuthPayload! @throttle(prefix: "adminLogin", maxAttempts: 5, decayMinutes: 1)

    "Revoke the token used for this request."
    logout: Boolean! @guard

    "Bet play-money credits on one outcome of a match (or one side, for the WINNER market). Odds are taken from the outcome at this moment."
    placeBet(input: PlaceBetInput! @spread): PlaceBetPayload!
        @guard
        @tokenCan(ability: "customer")
        @throttle(prefix: "placeBet", maxAttempts: 30, decayMinutes: 1)

    "Bet on two or more picks from different matches (a parlay). Total odds are the product of the picks' odds at this moment; it wins only if every pick wins."
    placeComboBet(input: PlaceComboBetInput! @spread): PlaceBetPayload!
        @guard
        @tokenCan(ability: "customer")
        @throttle(prefix: "placeBet", maxAttempts: 30, decayMinutes: 1)

    "Withdraw an open single while its market is open, for its value at the outcome's current odds (stake × placed odds ÷ current odds). expected is the value the player was shown; a lower current value is refused."
    cashOutBet(input: CashOutBetInput! @spread): PlaceBetPayload!
        @guard
        @tokenCan(ability: "customer")
        @throttle(prefix: "cashOutBet", maxAttempts: 30, decayMinutes: 1)

    "Add 500 play-money credits."
    topUpWallet: Wallet!
        @guard
        @tokenCan(ability: "customer")
        @throttle(prefix: "topUpWallet", maxAttempts: 10, decayMinutes: 1)

    "casino-sim: create a simulated match."
    simCreateMatch(input: SimCreateMatchInput! @spread): Match!
        @guard
        @tokenCan(ability: "sim")
        @canModel(ability: "manage", model: "App\\Models\\Fixture")

    "casino-sim: update score, odds or state. Finishing a match (with a winner) settles its bets."
    simUpdateMatch(id: ID! @rules(apply: ["exists:fixtures,id"]), input: SimUpdateMatchInput! @spread): Match!
        @guard
        @tokenCan(ability: "sim")
        @canModel(ability: "manage", model: "App\\Models\\Fixture")

    "Owner: replace a user's role. Audit-logged."
    adminAssignRole(
        userId: ID! @rules(apply: ["exists:users,id"])
        role: Role!
    ): User!
        @guard
        @tokenCan(ability: "admin")
        @canFind(ability: "assignRole", find: "userId", model: "App\\Models\\User")
}

type Subscription {
    "Pushed whenever casino-sim creates or updates a match (score, odds, state). Public; delivered through Reverb."
    matchUpdated(
        "Only matches of this `Videogame.slug`."
        game: String
        "Only this match (the match page)."
        id: ID
    ): Match
}

input RegisterInput {
    name: String! @rules(apply: ["required", "string", "min:2", "max:255"])
    email: String! @rules(apply: ["required", "email", "max:255", "unique:users,email"])
    password: String! @rules(apply: ["required", "string", "App\\Rules\\StrongPassword", "same:passwordConfirmation"])
    passwordConfirmation: String! @rules(apply: ["required", "string"])
}

input LoginInput {
    email: String! @rules(apply: ["required", "email"])
    password: String! @rules(apply: ["required", "string"])
}

type AuthPayload {
    token: String!
    user: User!
}

enum Role {
    CUSTOMER @enum(value: "customer")
    MODERATOR @enum(value: "moderator")
    ADMIN @enum(value: "admin")
    OWNER @enum(value: "owner")
}

type User {
    id: ID!
    name: String!
    email: String!
    roles: [String!]! @with(relation: "roles") @method(name: "roleNames")
    permissions: [String!]! @method(name: "permissionNames")
    emailVerifiedAt: DateTime @rename(attribute: "email_verified_at")
    createdAt: DateTime! @rename(attribute: "created_at")
    updatedAt: DateTime! @rename(attribute: "updated_at")
}

type Activity {
    id: ID!
    logName: String @rename(attribute: "log_name")
    event: String
    description: String!
    causer: User @morphTo
    subjectType: String @rename(attribute: "subject_type")
    subjectId: ID @rename(attribute: "subject_id")
    "JSON-encoded properties, including before/after state for admin changes."
    properties: String @method(name: "propertiesJson")
    createdAt: DateTime! @rename(attribute: "created_at")
}

# Esports data, sourced from PandaScore and cached in be. Ids are PandaScore ids.

enum MatchWindow {
    UPCOMING @enum(value: "upcoming")
    RUNNING @enum(value: "running")
    PAST @enum(value: "past")
}

enum MatchStatus {
    NOT_STARTED @enum(value: "not_started")
    RUNNING @enum(value: "running")
    FINISHED @enum(value: "finished")
    CANCELED @enum(value: "canceled")
    POSTPONED @enum(value: "postponed")
}

enum OpponentType {
    TEAM
    PLAYER
}

type Videogame {
    id: ID!
    name: String!
    slug: String!
}

type EsportsLeague {
    id: ID!
    name: String!
    imageUrl: String
}

type EsportsOpponent {
    id: ID!
    type: OpponentType!
    name: String!
    acronym: String
    imageUrl: String
}

type EsportsScore {
    opponentId: ID!
    score: Int!
}

type EsportsStream {
    url: String!
    embedUrl: String
    language: String
    main: Boolean!
    official: Boolean!
}

type EsportsMatch {
    id: ID!
    name: String!
    status: MatchStatus!
    "e.g. `best_of`."
    matchType: String
    numberOfGames: Int
    scheduledAt: DateTime
    beginAt: DateTime
    endAt: DateTime
    game: Videogame!
    league: EsportsLeague
    tournament: String
    serie: String
    opponents: [EsportsOpponent!]!
    scores: [EsportsScore!]!
    winnerId: ID
    streams: [EsportsStream!]!
}

type EsportsPageInfo {
    currentPage: Int!
    perPage: Int!
    total: Int!
    hasMorePages: Boolean!
}

type EsportsMatchPage {
    data: [EsportsMatch!]!
    pageInfo: EsportsPageInfo!
}

# Betting (play money). `Match` is a bettable match stored in be: seeded from the design or played out by casino-sim.
# It is unrelated to `EsportsMatch`, which is PandaScore data passed through read-only.
# MatchState, Side, BetStatus, BetType, MarketType, MarketStatus and OutcomeResult are registered from PHP enums in
# AppServiceProvider.

type Match @model(class: "App\\Models\\Fixture") {
    id: ID!
    "PandaScore videogame slug, e.g. `cs-go`."
    game: String!
    gameName: String! @rename(attribute: "game_name")
    tournament: String!
    teamA: String! @rename(attribute: "team_a")
    teamB: String! @rename(attribute: "team_b")
    teamAAcronym: String @rename(attribute: "team_a_acronym")
    teamBAcronym: String @rename(attribute: "team_b_acronym")
    "Best of how many maps (1 for a single map)."
    bestOf: Int! @rename(attribute: "best_of")
    "Maps won by team A (rounds or points for older matches without `maps`)."
    scoreA: Int! @rename(attribute: "score_a")
    scoreB: Int! @rename(attribute: "score_b")
    "Maps played so far, in order. While the match is live the last one is in play."
    maps: [MapScore!]! @method(name: "mapScores")
    "Decimal odds for team A to win the match: the WINNER market's odds. Simulated, not market odds."
    oddsA: Float! @rename(attribute: "odds_a")
    oddsB: Float! @rename(attribute: "odds_b")
    startsAt: DateTime! @rename(attribute: "starts_at")
    state: MatchState!
    winner: Side
    streamUrl: String @rename(attribute: "stream_url")
    "Everything to bet on in this match, in display order. Every match has a WINNER market."
    markets(status: [MarketStatus!] @in): [Market!]! @hasMany
}

"One map of a series."
type MapScore {
    "1 for the first map."
    number: Int!
    name: String!
    "Rounds (or points) won on this map."
    scoreA: Int!
    scoreB: Int!
    "Set once the map is over."
    winner: Side
}

"""
Something to bet on in a match. Clients build the title from `type` plus `map`, `half`, `round`, `line` and `side`,
e.g. MAP_TOTAL_ROUNDS, map 3, line 22.5 is "Map 3 - Total rounds" with outcomes OVER and UNDER 22.5.
"""
type Market {
    id: ID!
    "The feed's stable id for this market within the match."
    key: String!
    type: MarketType!
    map: Int
    "1 or 2."
    half: Int
    "The round a round market is about; for RACE_TO_ROUNDS, the number of rounds to reach first."
    round: Int
    "Handicap (team A's view; team B's is the negative) or total. Always ends in .5."
    line: Float
    "The team a TEAM_TOTAL_ROUNDS market is about."
    side: Side
    status: MarketStatus!
    outcomes: [MarketOutcome!]! @hasMany
}

type MarketOutcome {
    id: ID!
    "a, b, draw, over, under, odd, even, yes, no, or a map score such as `2:1` (team A's maps first)."
    key: String!
    "Current decimal odds."
    odds: Float!
    result: OutcomeResult
}

type Wallet {
    "Whole play-money credits (CR). No cash value."
    balance: Int!
}

type Bet {
    id: ID!
    type: BetType!
    "One pick for a SINGLE, one per match for a COMBO, in the order they were picked."
    selections: [BetSelection!]! @hasMany
    stake: Int!
    "Total odds when the bet was placed: the product of the selections' odds, rounded to cents after each pick."
    odds: Float!
    "stake × odds, rounded. Credited only if the bet is WON."
    payout: Int!
    "Credits paid when the bet was CASHED_OUT."
    cashOut: Int @rename(attribute: "cash_out")
    "WON once every selection has won; LOST as soon as one selection loses; CASHED_OUT if a single was withdrawn."
    status: BetStatus!
    placedAt: DateTime! @rename(attribute: "created_at")
    settledAt: DateTime @rename(attribute: "settled_at")
}

"One pick of a bet: an outcome of one of the match's markets."
type BetSelection {
    id: ID!
    match: Match! @belongsTo(relation: "fixture")
    side: Side @deprecated(reason: "Only set for WINNER picks. Use `market` and `outcome`.")
    market: Market! @hasOneThrough
    outcome: MarketOutcome! @belongsTo
    "Odds for this pick when the bet was placed."
    odds: Float!
    "PENDING until its market settles."
    status: BetStatus!
}

type PlaceBetPayload {
    bet: Bet!
    wallet: Wallet!
}

"Give either `side` (the WINNER market) or `outcomeId`."
input PlaceBetInput {
    matchId: ID! @rules(apply: ["integer"])
    side: Side
    outcomeId: ID @rules(apply: ["nullable", "integer"])
    stake: Int! @rules(apply: ["integer", "min:1", "max:1000000"])
}

input CashOutBetInput {
    betId: ID! @rules(apply: ["integer"])
    "The cash-out value the player was shown, in whole credits."
    expected: Int! @rules(apply: ["integer", "min:0"])
}

input PlaceComboBetInput {
    "At least two picks, each from a different match."
    selections: [BetSelectionInput!]! @rulesForArray(apply: ["min:2"])
    stake: Int! @rules(apply: ["integer", "min:1", "max:1000000"])
}

"Give either `side` (the WINNER market) or `outcomeId`."
input BetSelectionInput {
    matchId: ID! @rules(apply: ["integer"])
    side: Side
    outcomeId: ID @rules(apply: ["nullable", "integer"])
}

input SimCreateMatchInput {
    "PandaScore match id the matchup was taken from."
    externalId: ID @rename(attribute: "external_id") @rules(apply: ["nullable", "integer"])
    game: String! @rules(apply: ["regex:/^[a-z0-9-]{1,40}$/"])
    gameName: String! @rename(attribute: "game_name") @rules(apply: ["max:80"])
    tournament: String! @rules(apply: ["max:255"])
    teamA: String! @rename(attribute: "team_a") @rules(apply: ["max:255"])
    teamB: String! @rename(attribute: "team_b") @rules(apply: ["max:255", "different:teamA"])
    teamAAcronym: String @rename(attribute: "team_a_acronym") @rules(apply: ["nullable", "max:20"])
    teamBAcronym: String @rename(attribute: "team_b_acronym") @rules(apply: ["nullable", "max:20"])
    bestOf: Int @rename(attribute: "best_of") @rules(apply: ["nullable", "in:1,3,5,7"])
    oddsA: Float! @rename(attribute: "odds_a") @rules(apply: ["numeric", "min:1.01", "max:999"])
    oddsB: Float! @rename(attribute: "odds_b") @rules(apply: ["numeric", "min:1.01", "max:999"])
    startsAt: DateTime! @rename(attribute: "starts_at")
    state: MatchState
    streamUrl: String @rename(attribute: "stream_url") @rules(apply: ["nullable", "url", "max:255"])
}

input SimUpdateMatchInput {
    scoreA: Int @rename(attribute: "score_a") @rules(apply: ["nullable", "integer", "min:0", "max:999"])
    scoreB: Int @rename(attribute: "score_b") @rules(apply: ["nullable", "integer", "min:0", "max:999"])
    oddsA: Float @rename(attribute: "odds_a") @rules(apply: ["nullable", "numeric", "min:1.01", "max:999"])
    oddsB: Float @rename(attribute: "odds_b") @rules(apply: ["nullable", "numeric", "min:1.01", "max:999"])
    state: MatchState
    winner: Side
    "Replaces the map list."
    maps: [SimMapInput!] @rulesForArray(apply: ["max:7"])
    """
    Markets to open, reprice, suspend or settle. Leave out WINNER (it follows oddsA, oddsB and winner). Markets left out
    are unchanged. A settled market never changes; settling pays its picks at once. A match can only finish once every
    market is settled.
    """
    markets: [SimMarketInput!] @rulesForArray(apply: ["max:200"])
}

input SimMapInput {
    name: String! @rules(apply: ["max:40"])
    scoreA: Int! @rules(apply: ["integer", "min:0", "max:99"])
    scoreB: Int! @rules(apply: ["integer", "min:0", "max:99"])
    winner: Side
}

input SimMarketInput {
    key: String! @rules(apply: ["regex:/^[a-z0-9._:-]{1,64}$/"])
    type: MarketType!
    map: Int @rules(apply: ["nullable", "integer", "min:1", "max:7"])
    half: Int @rules(apply: ["nullable", "integer", "in:1,2"])
    round: Int @rules(apply: ["nullable", "integer", "min:1", "max:99"])
    line: Float @rules(apply: ["nullable", "numeric", "min:-999", "max:999"])
    side: Side
    status: MarketStatus!
    sort: Int @rules(apply: ["nullable", "integer", "min:0", "max:65535"])
    outcomes: [SimOutcomeInput!]! @rulesForArray(apply: ["min:2", "max:30"])
}

input SimOutcomeInput {
    key: String! @rules(apply: ["regex:/^[a-z0-9:]{1,16}$/"])
    odds: Float! @rules(apply: ["numeric", "min:1.01", "max:999"])
    result: OutcomeResult
}
